// ---------- Camada de armazenamento local (substitui o window.storage do Claude) ----------
// Os dados ficam salvos no navegador (localStorage), no dispositivo em que o app é usado.
window.storage = {
  async get(key) {
    try {
      const v = localStorage.getItem("mshop:" + key);
      return v != null ? { key, value: v } : null;
    } catch {
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem("mshop:" + key, value);
      return { key, value };
    } catch {
      return null;
    }
  },
  async delete(key) {
    try {
      localStorage.removeItem("mshop:" + key);
      return { key, deleted: true };
    } catch {
      return null;
    }
  },
};

import React, { useState, useEffect, useMemo } from "react";
import { createRoot } from "react-dom/client";
import {
  Package,
  Users,
  ShoppingBag,
  LayoutDashboard,
  Plus,
  Trash2,
  X,
  ChevronRight,
  Wallet,

  Minus,
  Camera,
  ImageOff,
  Pencil,
} from "lucide-react";

// Redimensiona e comprime a imagem antes de guardar (mantém o storage leve)
function resizeImage(file, maxSize = 400, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Paleta da marca (vinho / rosê) ----------
const C = {
  bg: "#FBF5F3",
  surface: "#FFFFFF",
  primary: "#7A2E43", // vinho
  primaryDark: "#5C1F32",
  accent: "#C9A15A", // dourado suave
  rose: "#C98A94",
  text: "#3A2530",
  muted: "#95818A",
  line: "#EEE1DF",
  success: "#3F7A5C",
  successBg: "#E8F2EC",
  warning: "#B4791F",
  warningBg: "#FBF0DE",
  danger: "#AC3B4A",
  dangerBg: "#FBEAEB",
};

const fmt = (n) =>
  (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
};

// ---------- Storage helpers ----------
async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : fallback;
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch {
    // silencioso — dados seguem em memória nesta sessão
  }
}

export default function LojinhaApp() {
  const [tab, setTab] = useState("resumo");
  const [loading, setLoading] = useState(true);
  const [products, setProducts] = useState([]);
  const [clients, setClients] = useState([]);
  const [sales, setSales] = useState([]);

  useEffect(() => {
    (async () => {
      const [p, c, s] = await Promise.all([
        loadKey("products", []),
        loadKey("clients", []),
        loadKey("sales", []),
      ]);
      setProducts(p);
      setClients(c);
      setSales(s);
      setLoading(false);
    })();
  }, []);

  const updProducts = (next) => {
    setProducts(next);
    saveKey("products", next);
  };
  const updClients = (next) => {
    setClients(next);
    saveKey("clients", next);
  };
  const updSales = (next) => {
    setSales(next);
    saveKey("sales", next);
  };

  const tabs = [
    { id: "resumo", label: "Resumo", icon: LayoutDashboard },
    { id: "produtos", label: "Produtos", icon: Package },
    { id: "clientes", label: "Clientes", icon: Users },
    { id: "vendas", label: "Vendas", icon: ShoppingBag },
  ];

  return (
    <div
      className="min-h-screen w-full flex flex-col"
      style={{ background: C.bg, color: C.text, fontFamily: "system-ui, sans-serif" }}
    >
      <header
        className="px-5 pt-6 pb-4 sticky top-0 z-10"
        style={{ background: C.primary, color: "#fff" }}
      >
        <div className="flex items-baseline gap-2">
          <h1 className="text-2xl tracking-wide" style={{ fontFamily: "Georgia, serif" }}>
            M Shop
          </h1>
          <span className="text-xs opacity-80">controle de vendas</span>
        </div>
      </header>

      <main className="flex-1 px-4 py-4 pb-24 max-w-md w-full mx-auto">
        {loading ? (
          <div className="text-center py-20 text-sm" style={{ color: C.muted }}>
            Carregando...
          </div>
        ) : (
          <>
            {tab === "resumo" && (
              <Resumo products={products} sales={sales} clients={clients} />
            )}
            {tab === "produtos" && (
              <Produtos products={products} setProducts={updProducts} />
            )}
            {tab === "clientes" && (
              <Clientes clients={clients} setClients={updClients} sales={sales} />
            )}
            {tab === "vendas" && (
              <Vendas
                sales={sales}
                setSales={updSales}
                products={products}
                setProducts={updProducts}
                clients={clients}
                setClients={updClients}
              />
            )}
          </>
        )}
      </main>

      <nav
        className="fixed bottom-0 left-0 right-0 flex justify-around items-center py-2 border-t"
        style={{ background: C.surface, borderColor: C.line }}
      >
        {tabs.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setTab(t.id)}
              className="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg transition-colors"
              style={{ color: active ? C.primary : C.muted }}
            >
              <Icon size={20} strokeWidth={active ? 2.4 : 1.8} />
              <span className="text-[10px] font-medium">{t.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

// ============================================================
// RESUMO
// ============================================================
function Resumo({ products, sales, clients }) {
  const stats = useMemo(() => {
    let receita = 0,
      custo = 0,
      recebido = 0,
      pendente = 0;
    sales.forEach((s) => {
      receita += s.total;
      recebido += s.paid;
      pendente += Math.max(s.total - s.paid, 0);
      (s.items || []).forEach((it) => {
        custo += (it.costPrice || 0) * it.qty;
      });
    });
    const lucro = receita - custo;
    const estoqueBaixo = products.filter((p) => Number(p.stock) <= 2);
    return { receita, custo, lucro, recebido, pendente, estoqueBaixo };
  }, [products, sales]);

  const ultimasVendas = [...sales]
    .sort((a, b) => (b.date > a.date ? 1 : -1))
    .slice(0, 5);

  return (
    <div className="flex flex-col gap-3">
      <div className="grid grid-cols-2 gap-3">
        <Card label="Vendido no total" value={fmt(stats.receita)} color={C.primary} />
        <Card label="Lucro estimado" value={fmt(stats.lucro)} color={C.success} />
        <Card label="Recebido" value={fmt(stats.recebido)} color={C.success} />
        <Card label="A receber" value={fmt(stats.pendente)} color={C.warning} />
      </div>

      <div className="grid grid-cols-3 gap-3 mt-1">
        <MiniStat label="Produtos" value={products.length} />
        <MiniStat label="Clientes" value={clients.length} />
        <MiniStat label="Vendas" value={sales.length} />
      </div>

      {stats.estoqueBaixo.length > 0 && (
        <div
          className="rounded-xl p-3 text-sm mt-1"
          style={{ background: C.warningBg, color: C.warning }}
        >
          <strong>Estoque baixo:</strong>{" "}
          {stats.estoqueBaixo.map((p) => p.name).join(", ")}
        </div>
      )}

      <div className="mt-3">
        <h3 className="text-sm font-semibold mb-2" style={{ color: C.muted }}>
          Últimas vendas
        </h3>
        {ultimasVendas.length === 0 ? (
          <EmptyHint text="Nenhuma venda registrada ainda." />
        ) : (
          <div className="flex flex-col gap-2">
            {ultimasVendas.map((s) => (
              <div
                key={s.id}
                className="rounded-xl p-3 flex justify-between items-center"
                style={{ background: C.surface, border: `1px solid ${C.line}` }}
              >
                <div>
                  <div className="text-sm font-medium">{s.clientName}</div>
                  <div className="text-xs" style={{ color: C.muted }}>
                    {fmtDate(s.date)} · {s.payment === "avista" ? "À vista" : "Parcelado"}
                  </div>
                </div>
                <div className="text-right">
                  <div className="text-sm font-semibold">{fmt(s.total)}</div>
                  <StatusBadge sale={s} small />
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function Card({ label, value, color }) {
  return (
    <div
      className="rounded-xl p-3"
      style={{ background: C.surface, border: `1px solid ${C.line}` }}
    >
      <div className="text-xs" style={{ color: C.muted }}>
        {label}
      </div>
      <div className="text-lg font-semibold mt-0.5" style={{ color }}>
        {value}
      </div>
    </div>
  );
}

function MiniStat({ label, value }) {
  return (
    <div
      className="rounded-xl py-2 text-center"
      style={{ background: C.surface, border: `1px solid ${C.line}` }}
    >
      <div className="text-base font-semibold">{value}</div>
      <div className="text-[10px]" style={{ color: C.muted }}>
        {label}
      </div>
    </div>
  );
}

function EmptyHint({ text }) {
  return (
    <div
      className="rounded-xl p-4 text-sm text-center"
      style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted }}
    >
      {text}
    </div>
  );
}

// ============================================================
// PRODUTOS
// ============================================================
function Produtos({ products, setProducts }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ name: "", cost: "", price: "", stock: "", photo: "" });
  const [photoLoading, setPhotoLoading] = useState(false);

  const reset = () => setForm({ name: "", cost: "", price: "", stock: "", photo: "" });

  const handlePhoto = async (file) => {
    if (!file) return;
    setPhotoLoading(true);
    try {
      const dataUrl = await resizeImage(file);
      setForm((f) => ({ ...f, photo: dataUrl }));
    } catch {
      // se falhar, segue sem foto
    }
    setPhotoLoading(false);
  };

  const startEdit = (p) => {
    setEditingId(p.id);
    setForm({
      name: p.name,
      cost: String(p.cost ?? ""),
      price: String(p.price ?? ""),
      stock: String(p.stock ?? ""),
      photo: p.photo || "",
    });
    setShowForm(true);
  };

  const closeForm = () => {
    setShowForm(false);
    setEditingId(null);
    reset();
  };

  const save = () => {
    if (!form.name.trim() || !form.price) return;
    if (editingId) {
      setProducts(
        products.map((p) =>
          p.id === editingId
            ? {
                ...p,
                name: form.name.trim(),
                cost: parseFloat(form.cost) || 0,
                price: parseFloat(form.price) || 0,
                stock: parseInt(form.stock, 10) || 0,
                photo: form.photo || "",
              }
            : p
        )
      );
    } else {
      const novo = {
        id: uid(),
        name: form.name.trim(),
        cost: parseFloat(form.cost) || 0,
        price: parseFloat(form.price) || 0,
        stock: parseInt(form.stock, 10) || 0,
        photo: form.photo || "",
      };
      setProducts([novo, ...products]);
    }
    closeForm();
  };

  const remove = (id) => {
    setProducts(products.filter((p) => p.id !== id));
    if (editingId === id) closeForm();
  };

  const adjustStock = (id, delta) => {
    setProducts(
      products.map((p) =>
        p.id === id ? { ...p, stock: Math.max(0, (Number(p.stock) || 0) + delta) } : p
      )
    );
  };

  return (
    <div className="flex flex-col gap-3">
      <button
        onClick={() => (showForm ? closeForm() : setShowForm(true))}
        className="flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-sm font-medium"
        style={{ background: showForm ? C.line : C.primary, color: showForm ? C.text : "#fff" }}
      >
        {showForm ? (
          <>
            <X size={16} /> Cancelar
          </>
        ) : (
          <>
            <Plus size={16} /> Novo produto
          </>
        )}
      </button>

      {showForm && (
        <div
          className="rounded-xl p-3 flex flex-col gap-2"
          style={{ background: C.surface, border: `1px solid ${C.line}` }}
        >
          {editingId && (
            <div className="text-xs font-medium" style={{ color: C.primary }}>
              Editando produto
            </div>
          )}
          <Field label="Foto do produto (opcional)">
            <div className="flex items-center gap-3">
              <label
                className="flex items-center justify-center rounded-lg overflow-hidden shrink-0 cursor-pointer"
                style={{
                  width: 56,
                  height: 56,
                  background: C.bg,
                  border: `1px solid ${C.line}`,
                }}
              >
                {photoLoading ? (
                  <span className="text-[9px]" style={{ color: C.muted }}>
                    ...
                  </span>
                ) : form.photo ? (
                  <img src={form.photo} alt="" className="w-full h-full object-cover" />
                ) : (
                  <Camera size={18} style={{ color: C.muted }} />
                )}
                <input
                  type="file"
                  accept="image/*"
                  className="hidden"
                  onChange={(e) => handlePhoto(e.target.files?.[0])}
                />
              </label>
              {form.photo && (
                <button
                  type="button"
                  onClick={() => setForm((f) => ({ ...f, photo: "" }))}
                  className="text-xs"
                  style={{ color: C.danger }}
                >
                  Remover foto
                </button>
              )}
            </div>
          </Field>
          <Field label="Nome do produto">
            <input
              className="input"
              style={inputStyle}
              value={form.name}
              onChange={(e) => setForm({ ...form, name: e.target.value })}
              placeholder="Ex: Body Splash VS 250ml"
            />
          </Field>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Valor de custo">
              <input
                className="input"
                style={inputStyle}
                type="number"
                inputMode="decimal"
                value={form.cost}
                onChange={(e) => setForm({ ...form, cost: e.target.value })}
                placeholder="0,00"
              />
            </Field>
            <Field label="Valor de venda">
              <input
                className="input"
                style={inputStyle}
                type="number"
                inputMode="decimal"
                value={form.price}
                onChange={(e) => setForm({ ...form, price: e.target.value })}
                placeholder="0,00"
              />
            </Field>
          </div>
          <Field label="Estoque (unidades)">
            <input
              className="input"
              style={inputStyle}
              type="number"
              inputMode="numeric"
              value={form.stock}
              onChange={(e) => setForm({ ...form, stock: e.target.value })}
              placeholder="0"
            />
          </Field>
          <button
            onClick={save}
            className="rounded-lg py-2 text-sm font-medium mt-1"
            style={{ background: C.primary, color: "#fff" }}
          >
            {editingId ? "Salvar alterações" : "Salvar produto"}
          </button>
        </div>
      )}

      {products.length === 0 ? (
        <EmptyHint text="Nenhum produto cadastrado ainda." />
      ) : (
        <div className="flex flex-col gap-2">
          {products.map((p) => {
            const margem = p.price - p.cost;
            return (
              <div
                key={p.id}
                className="rounded-xl p-3"
                style={{ background: C.surface, border: `1px solid ${C.line}` }}
              >
                <div className="flex justify-between items-start gap-2">
                  <div className="flex items-start gap-2.5 min-w-0">
                    <div
                      className="rounded-lg overflow-hidden shrink-0 flex items-center justify-center"
                      style={{ width: 44, height: 44, background: C.bg, border: `1px solid ${C.line}` }}
                    >
                      {p.photo ? (
                        <img src={p.photo} alt="" className="w-full h-full object-cover" />
                      ) : (
                        <ImageOff size={16} style={{ color: C.muted }} />
                      )}
                    </div>
                    <div className="min-w-0">
                      <div className="text-sm font-medium truncate">{p.name}</div>
                      <div className="text-xs mt-0.5" style={{ color: C.muted }}>
                        Custo {fmt(p.cost)} · Venda {fmt(p.price)} · Margem {fmt(margem)}
                      </div>
                    </div>
                  </div>
                  <div className="flex items-center gap-2 shrink-0">
                    <button onClick={() => startEdit(p)} style={{ color: C.primary }}>
                      <Pencil size={16} />
                    </button>
                    <button onClick={() => remove(p.id)} style={{ color: C.danger }}>
                      <Trash2 size={16} />
                    </button>
                  </div>
                </div>
                <div className="flex items-center justify-between mt-2">
                  <span
                    className="text-xs px-2 py-0.5 rounded-full"
                    style={{
                      background: p.stock <= 2 ? C.warningBg : C.successBg,
                      color: p.stock <= 2 ? C.warning : C.success,
                    }}
                  >
                    Estoque: {p.stock}
                  </span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => adjustStock(p.id, -1)}
                      className="w-6 h-6 rounded-full flex items-center justify-center"
                      style={{ background: C.line }}
                    >
                      <Minus size={12} />
                    </button>
                    <button
                      onClick={() => adjustStock(p.id, 1)}
                      className="w-6 h-6 rounded-full flex items-center justify-center"
                      style={{ background: C.line }}
                    >
                      <Plus size={12} />
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ============================================================
// CLIENTES
// ============================================================
function Clientes({ clients, setClients, sales }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: "", phone: "" });

  const add = () => {
    if (!form.name.trim()) return;
    setClients([{ id: uid(), name: form.name.trim(), phone: form.phone.trim() }, ...clients]);
    setForm({ name: "", phone: "" });
    setShowForm(false);
  };

  const remove = (id) => setClients(clients.filter((c) => c.id !== id));

  const pendentePorCliente = (clientId) =>
    sales
      .filter((s) => s.clientId === clientId)
      .reduce((acc, s) => acc + Math.max(s.total - s.paid, 0), 0);

  return (
    <div className="flex flex-col gap-3">
      <button
        onClick={() => setShowForm((v) => !v)}
        className="flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-sm font-medium"
        style={{ background: showForm ? C.line : C.primary, color: showForm ? C.text : "#fff" }}
      >
        {showForm ? (
          <>
            <X size={16} /> Cancelar
          </>
        ) : (
          <>
            <Plus size={16} /> Novo cliente
          </>
        )}
      </button>

      {showForm && (
        <div
          className="rounded-xl p-3 flex flex-col gap-2"
          style={{ background: C.surface, border: `1px solid ${C.line}` }}
        >
          <Field label="Nome">
            <input
              className="input"
              style={inputStyle}
              value={form.name}
              onChange={(e) => setForm({ ...form, name: e.target.value })}
              placeholder="Nome do cliente"
            />
          </Field>
          <Field label="Telefone / WhatsApp (opcional)">
            <input
              className="input"
              style={inputStyle}
              value={form.phone}
              onChange={(e) => setForm({ ...form, phone: e.target.value })}
              placeholder="(00) 00000-0000"
            />
          </Field>
          <button
            onClick={add}
            className="rounded-lg py-2 text-sm font-medium mt-1"
            style={{ background: C.primary, color: "#fff" }}
          >
            Salvar cliente
          </button>
        </div>
      )}

      {clients.length === 0 ? (
        <EmptyHint text="Nenhum cliente cadastrado ainda." />
      ) : (
        <div className="flex flex-col gap-2">
          {clients.map((c) => {
            const pend = pendentePorCliente(c.id);
            return (
              <div
                key={c.id}
                className="rounded-xl p-3 flex justify-between items-center"
                style={{ background: C.surface, border: `1px solid ${C.line}` }}
              >
                <div>
                  <div className="text-sm font-medium">{c.name}</div>
                  {c.phone && (
                    <div className="text-xs" style={{ color: C.muted }}>
                      {c.phone}
                    </div>
                  )}
                  {pend > 0 && (
                    <div className="text-xs mt-0.5" style={{ color: C.warning }}>
                      Deve {fmt(pend)}
                    </div>
                  )}
                </div>
                <button onClick={() => remove(c.id)} style={{ color: C.danger }}>
                  <Trash2 size={16} />
                </button>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ============================================================
// VENDAS
// ============================================================
function Vendas({ sales, setSales, products, setProducts, clients, setClients }) {
  const [showForm, setShowForm] = useState(false);
  const [editingSaleId, setEditingSaleId] = useState(null);
  const [clientId, setClientId] = useState("");
  const [newClientName, setNewClientName] = useState("");
  const [cart, setCart] = useState([]); // {productId, name, price, cost, qty}
  const [selProduct, setSelProduct] = useState("");
  const [qty, setQty] = useState(1);
  const [payment, setPayment] = useState("avista");
  const [paidInput, setPaidInput] = useState("");
  const [discountType, setDiscountType] = useState("valor"); // 'valor' | 'percent'
  const [discountInput, setDiscountInput] = useState("");

  const subtotal = cart.reduce((acc, it) => acc + it.price * it.qty, 0);
  const discountRaw = parseFloat(discountInput) || 0;
  const discount = Math.min(
    subtotal,
    Math.max(0, discountType === "percent" ? (subtotal * discountRaw) / 100 : discountRaw)
  );
  const total = Math.max(subtotal - discount, 0);
  const paid =
    payment === "avista"
      ? paidInput === ""
        ? total
        : parseFloat(paidInput) || 0
      : parseFloat(paidInput) || 0;
  const pendente = Math.max(total - paid, 0);

  const addItem = () => {
    if (!selProduct || qty <= 0) return;
    const prod = products.find((p) => p.id === selProduct);
    if (!prod) return;
    setCart((c) => {
      const existing = c.find((it) => it.productId === prod.id);
      if (existing) {
        return c.map((it) =>
          it.productId === prod.id ? { ...it, qty: it.qty + qty } : it
        );
      }
      return [
        ...c,
        { productId: prod.id, name: prod.name, price: prod.price, costPrice: prod.cost, qty },
      ];
    });
    setSelProduct("");
    setQty(1);
  };

  const removeItem = (productId) => setCart((c) => c.filter((it) => it.productId !== productId));

  const resetForm = () => {
    setEditingSaleId(null);
    setClientId("");
    setNewClientName("");
    setCart([]);
    setSelProduct("");
    setQty(1);
    setPayment("avista");
    setPaidInput("");
    setDiscountType("valor");
    setDiscountInput("");
  };

  const startEditSale = (sale) => {
    setEditingSaleId(sale.id);
    setClientId(sale.clientId);
    setNewClientName("");
    setCart(sale.items.map((it) => ({ ...it })));
    setSelProduct("");
    setQty(1);
    setPayment(sale.payment);
    setPaidInput(String(sale.paid));
    setDiscountType("valor");
    setDiscountInput(sale.discount ? String(sale.discount) : "");
    setShowForm(true);
  };

  const finalizarVenda = () => {
    if (cart.length === 0) return;
    let cId = clientId;
    let cName = "";
    if (cId === "novo") {
      if (!newClientName.trim()) return;
      const novo = { id: uid(), name: newClientName.trim(), phone: "" };
      setClients([novo, ...clients]);
      cId = novo.id;
      cName = novo.name;
    } else {
      const c = clients.find((cl) => cl.id === cId);
      if (!c) return;
      cName = c.name;
    }

    if (editingSaleId) {
      const original = sales.find((s) => s.id === editingSaleId);

      // repõe o estoque da venda original e aplica a baixa da nova versão
      let updatedProducts = products;
      if (original) {
        updatedProducts = updatedProducts.map((p) => {
          const it = original.items.find((i) => i.productId === p.id);
          return it ? { ...p, stock: (Number(p.stock) || 0) + it.qty } : p;
        });
      }
      updatedProducts = updatedProducts.map((p) => {
        const it = cart.find((i) => i.productId === p.id);
        return it ? { ...p, stock: Math.max(0, (Number(p.stock) || 0) - it.qty) } : p;
      });
      setProducts(updatedProducts);

      setSales(
        sales.map((s) =>
          s.id === editingSaleId
            ? {
                ...s,
                clientId: cId,
                clientName: cName,
                items: cart,
                subtotal,
                discount,
                total,
                payment,
                paid,
              }
            : s
        )
      );
    } else {
      const venda = {
        id: uid(),
        clientId: cId,
        clientName: cName,
        date: todayISO(),
        items: cart,
        subtotal,
        discount,
        total,
        payment,
        paid,
      };
      setSales([venda, ...sales]);

      // baixa de estoque
      setProducts(
        products.map((p) => {
          const it = cart.find((i) => i.productId === p.id);
          return it ? { ...p, stock: Math.max(0, (Number(p.stock) || 0) - it.qty) } : p;
        })
      );
    }

    resetForm();
    setShowForm(false);
  };

  const registrarPagamento = (saleId, valor) => {
    if (!valor || valor <= 0) return;
    setSales(
      sales.map((s) =>
        s.id === saleId ? { ...s, paid: Math.min(s.total, s.paid + valor) } : s
      )
    );
  };

  const removeSale = (id) => {
    const original = sales.find((s) => s.id === id);
    if (original) {
      setProducts(
        products.map((p) => {
          const it = original.items.find((i) => i.productId === p.id);
          return it ? { ...p, stock: (Number(p.stock) || 0) + it.qty } : p;
        })
      );
    }
    setSales(sales.filter((s) => s.id !== id));
    if (editingSaleId === id) {
      resetForm();
      setShowForm(false);
    }
  };

  return (
    <div className="flex flex-col gap-3">
      <button
        onClick={() => (showForm ? (resetForm(), setShowForm(false)) : setShowForm(true))}
        className="flex items-center justify-center gap-1.5 rounded-xl py-2.5 text-sm font-medium"
        style={{ background: showForm ? C.line : C.primary, color: showForm ? C.text : "#fff" }}
      >
        {showForm ? (
          <>
            <X size={16} /> Cancelar
          </>
        ) : (
          <>
            <Plus size={16} /> Nova venda
          </>
        )}
      </button>

      {showForm && (
        <div
          className="rounded-xl p-3 flex flex-col gap-3"
          style={{ background: C.surface, border: `1px solid ${C.line}` }}
        >
          <Field label="Cliente">
            <select
              className="input"
              style={inputStyle}
              value={clientId}
              onChange={(e) => setClientId(e.target.value)}
            >
              <option value="">Selecionar cliente...</option>
              {clients.map((c) => (
                <option key={c.id} value={c.id}>
                  {c.name}
                </option>
              ))}
              <option value="novo">+ Novo cliente</option>
            </select>
          </Field>
          {clientId === "novo" && (
            <Field label="Nome do novo cliente">
              <input
                className="input"
                style={inputStyle}
                value={newClientName}
                onChange={(e) => setNewClientName(e.target.value)}
                placeholder="Nome do cliente"
              />
            </Field>
          )}

          <div className="h-px" style={{ background: C.line }} />

          <Field label="Adicionar produto">
            <div className="flex gap-2">
              <select
                className="input flex-1"
                style={inputStyle}
                value={selProduct}
                onChange={(e) => setSelProduct(e.target.value)}
              >
                <option value="">Produto...</option>
                {products.map((p) => (
                  <option key={p.id} value={p.id}>
                    {p.name} ({fmt(p.price)})
                  </option>
                ))}
              </select>
              <input
                type="number"
                min={1}
                className="input"
                style={{ ...inputStyle, width: 56 }}
                value={qty}
                onChange={(e) => setQty(parseInt(e.target.value, 10) || 1)}
              />
              <button
                onClick={addItem}
                className="rounded-lg px-3"
                style={{ background: C.primary, color: "#fff" }}
              >
                <Plus size={16} />
              </button>
            </div>
          </Field>

          {cart.length > 0 && (
            <div className="flex flex-col gap-1.5">
              {cart.map((it) => (
                <div
                  key={it.productId}
                  className="flex justify-between items-center text-sm rounded-lg px-2.5 py-1.5"
                  style={{ background: C.bg }}
                >
                  <span>
                    {it.qty}x {it.name}
                  </span>
                  <div className="flex items-center gap-2">
                    <span>{fmt(it.price * it.qty)}</span>
                    <button onClick={() => removeItem(it.productId)} style={{ color: C.danger }}>
                      <X size={14} />
                    </button>
                  </div>
                </div>
              ))}

              <div className="h-px my-1" style={{ background: C.line }} />

              <Field label="Desconto (opcional)">
                <div className="flex gap-2">
                  <div className="flex rounded-lg overflow-hidden shrink-0" style={{ border: `1px solid ${C.line}` }}>
                    {[
                      { id: "valor", label: "R$" },
                      { id: "percent", label: "%" },
                    ].map((opt) => (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => setDiscountType(opt.id)}
                        className="px-3 text-xs font-medium"
                        style={{
                          background: discountType === opt.id ? C.primary : "#fff",
                          color: discountType === opt.id ? "#fff" : C.text,
                        }}
                      >
                        {opt.label}
                      </button>
                    ))}
                  </div>
                  <input
                    type="number"
                    inputMode="decimal"
                    className="input flex-1"
                    style={inputStyle}
                    value={discountInput}
                    onChange={(e) => setDiscountInput(e.target.value)}
                    placeholder="0"
                  />
                </div>
              </Field>

              <div className="flex flex-col gap-0.5 px-1 pt-1">
                <div className="flex justify-between text-xs" style={{ color: C.muted }}>
                  <span>Subtotal</span>
                  <span>{fmt(subtotal)}</span>
                </div>
                {discount > 0 && (
                  <div className="flex justify-between text-xs" style={{ color: C.danger }}>
                    <span>Desconto</span>
                    <span>-{fmt(discount)}</span>
                  </div>
                )}
                <div className="flex justify-between text-sm font-semibold">
                  <span>Total</span>
                  <span>{fmt(total)}</span>
                </div>
              </div>
            </div>
          )}

          <div className="h-px" style={{ background: C.line }} />

          <Field label="Forma de pagamento">
            <div className="flex gap-2">
              {[
                { id: "avista", label: "À vista" },
                { id: "parcelado", label: "Parcelado" },
              ].map((opt) => (
                <button
                  key={opt.id}
                  onClick={() => {
                    setPayment(opt.id);
                    setPaidInput("");
                  }}
                  className="flex-1 rounded-lg py-2 text-sm font-medium"
                  style={{
                    background: payment === opt.id ? C.primary : C.bg,
                    color: payment === opt.id ? "#fff" : C.text,
                    border: `1px solid ${payment === opt.id ? C.primary : C.line}`,
                  }}
                >
                  {opt.label}
                </button>
              ))}
            </div>
          </Field>

          <Field label={payment === "avista" ? "Valor pago (padrão: total)" : "Valor pago agora"}>
            <input
              type="number"
              inputMode="decimal"
              className="input"
              style={inputStyle}
              value={paidInput}
              onChange={(e) => setPaidInput(e.target.value)}
              placeholder={payment === "avista" ? fmt(total) : "0,00"}
            />
          </Field>

          <div className="flex justify-between text-sm px-1">
            <span style={{ color: C.muted }}>Valor pendente</span>
            <span style={{ color: pendente > 0 ? C.warning : C.success, fontWeight: 600 }}>
              {fmt(pendente)}
            </span>
          </div>

          <button
            onClick={finalizarVenda}
            disabled={cart.length === 0 || (!clientId)}
            className="rounded-lg py-2.5 text-sm font-semibold mt-1 disabled:opacity-40"
            style={{ background: C.primary, color: "#fff" }}
          >
            Finalizar venda
          </button>
        </div>
      )}

      {sales.length === 0 ? (
        <EmptyHint text="Nenhuma venda registrada ainda." />
      ) : (
        <div className="flex flex-col gap-2">
          {[...sales]
            .sort((a, b) => (b.date > a.date ? 1 : -1))
            .map((s) => (
              <SaleCard
                key={s.id}
                sale={s}
                onRegistrarPagamento={registrarPagamento}
                onRemove={removeSale}
              />
            ))}
        </div>
      )}
    </div>
  );
}

function SaleCard({ sale, onRegistrarPagamento, onRemove }) {
  const [open, setOpen] = useState(false);
  const [valor, setValor] = useState("");
  const pendente = Math.max(sale.total - sale.paid, 0);

  return (
    <div
      className="rounded-xl p-3"
      style={{ background: C.surface, border: `1px solid ${C.line}` }}
    >
      <button className="w-full flex justify-between items-start" onClick={() => setOpen((v) => !v)}>
        <div className="text-left">
          <div className="text-sm font-medium">{sale.clientName}</div>
          <div className="text-xs" style={{ color: C.muted }}>
            {fmtDate(sale.date)} · {sale.payment === "avista" ? "À vista" : "Parcelado"} ·{" "}
            {sale.items.reduce((a, i) => a + i.qty, 0)} item(ns)
          </div>
        </div>
        <div className="flex items-center gap-1.5">
          <div className="text-right">
            <div className="text-sm font-semibold">{fmt(sale.total)}</div>
            <StatusBadge sale={sale} small />
          </div>
          <ChevronRight
            size={16}
            style={{ transform: open ? "rotate(90deg)" : "none", color: C.muted }}
          />
        </div>
      </button>

      {open && (
        <div className="mt-3 flex flex-col gap-2 text-sm">
          {sale.items.map((it) => (
            <div key={it.productId} className="flex justify-between" style={{ color: C.muted }}>
              <span>
                {it.qty}x {it.name}
              </span>
              <span>{fmt(it.price * it.qty)}</span>
            </div>
          ))}
          <div className="h-px my-1" style={{ background: C.line }} />
          {sale.discount > 0 && (
            <>
              <div className="flex justify-between" style={{ color: C.muted }}>
                <span>Subtotal</span>
                <span>{fmt(sale.subtotal ?? sale.total)}</span>
              </div>
              <div className="flex justify-between" style={{ color: C.danger }}>
                <span>Desconto</span>
                <span>-{fmt(sale.discount)}</span>
              </div>
            </>
          )}
          <div className="flex justify-between">
            <span style={{ color: C.muted }}>Pago</span>
            <span style={{ color: C.success }}>{fmt(sale.paid)}</span>
          </div>
          <div className="flex justify-between">
            <span style={{ color: C.muted }}>Pendente</span>
            <span style={{ color: pendente > 0 ? C.warning : C.success }}>{fmt(pendente)}</span>
          </div>

          {pendente > 0 && (
            <div className="flex gap-2 mt-1">
              <input
                type="number"
                inputMode="decimal"
                placeholder="Valor recebido"
                className="input flex-1"
                style={inputStyle}
                value={valor}
                onChange={(e) => setValor(e.target.value)}
              />
              <button
                className="rounded-lg px-3 text-xs font-medium"
                style={{ background: C.success, color: "#fff" }}
                onClick={() => {
                  const v = parseFloat(valor) || 0;
                  onRegistrarPagamento(sale.id, v);
                  setValor("");
                }}
              >
                Registrar
              </button>
            </div>
          )}

          <button
            onClick={() => onRemove(sale.id)}
            className="flex items-center gap-1 text-xs mt-2 self-start"
            style={{ color: C.danger }}
          >
            <Trash2 size={13} /> Excluir venda
          </button>
        </div>
      )}
    </div>
  );
}

function StatusBadge({ sale, small }) {
  const pendente = Math.max(sale.total - sale.paid, 0);
  let bg, color, label, Icon;
  if (pendente <= 0) {
    bg = C.successBg;
    color = C.success;
    label = "Pago";
    Icon = CircleCheck;
  } else if (sale.paid > 0) {
    bg = C.warningBg;
    color = C.warning;
    label = "Parcial";
    Icon = Wallet;
  } else {
    bg = C.dangerBg;
    color = C.danger;
    label = "Pendente";
    Icon = CircleDollarSign;
  }
  return (
    <span
      className={`inline-flex items-center gap-1 rounded-full ${small ? "px-1.5 py-0.5 text-[10px]" : "px-2 py-1 text-xs"} font-medium`}
      style={{ background: bg, color }}
    >
      <Icon size={small ? 10 : 12} />
      {label}
    </span>
  );
}

function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1">
      <span className="text-xs font-medium" style={{ color: C.muted }}>
        {label}
      </span>
      {children}
    </label>
  );
}

const inputStyle = {
  border: `1px solid ${C.line}`,
  borderRadius: 8,
  padding: "8px 10px",
  fontSize: 14,
  background: "#fff",
  color: C.text,
  outline: "none",
  width: "100%",
};

const root = createRoot(document.getElementById("root"));
root.render(<LojinhaApp />);
</script>
</body>
</html>
